[tool.ruff]
line-length = 100
target-version = "py314"
src = ["."]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "SIM", "N", "PTH", "S", "RUF"]

[tool.ruff.lint.per-file-ignores]
"tests/**/*.py" = ["N802", "S101", "S603"]
"scripts/mvp_*probe*.py" = ["E402", "E501", "N806", "N814", "PTH123", "S101", "S112", "S603", "S607", "S608"]

[tool.pytest.ini_options]
minversion = "8.0"
testpaths = ["tests"]
addopts = "-ra"
pythonpath = ["."]
markers = [
    "windows_only: test requires Windows-specific filesystem behavior",
    "slow: test may take longer than the normal suite",
    "gui: test exercises the Qt GUI",
    "manual: test is not part of the automated suite",
]

name: CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

jobs:
  ci:
    name: CI
    runs-on: windows-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python 3.14
        uses: actions/setup-python@v5
        with:
          python-version: '3.14'
          cache: 'pip'
          cache-dependency-path: 'requirements-dev.txt'

      - name: Verify Python version
        shell: powershell
        run: |
          $ver = python --version
          Write-Output "Detected Python: $ver"
          python -c "import sys; assert sys.version_info[:2] == (3, 14), f'Expected Python 3.14, got {sys.version}'; print('Python 3.14 verified.')"

      - name: Install dependencies
        shell: powershell
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements-dev.txt

      - name: Run verification gate (scripts/verify.ps1)
        shell: powershell
        env:
          QT_QPA_PLATFORM: offscreen
        run: |
          powershell -ExecutionPolicy Bypass -File .\scripts\verify.ps1
          if ($LASTEXITCODE -ne 0) {
            Write-Error "Verification gate failed with exit code $LASTEXITCODE"
            exit $LASTEXITCODE
          }
